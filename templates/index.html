<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问题笔记本</title>
<style>
  /* ========== 基础 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }

  /* ========== 登录页 ========== */
  .login-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%; max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .login-card h1 {
    font-size: 22px; color: #38bdf8; margin-bottom: 6px;
  }
  .login-card .sub {
    font-size: 13px; color: #94a3b8; margin-bottom: 20px;
  }
  .login-card label {
    display: block; font-size: 13px; color: #94a3b8;
    margin: 12px 0 4px;
  }
  .login-card input[type="password"] {
    width: 100%;
    background: #0f172a; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px;
    padding: 10px 12px; font-size: 15px; outline: none;
  }
  .login-card input[type="password"]:focus { border-color: #38bdf8; }
  .login-card .actions {
    margin-top: 20px; display: flex; justify-content: flex-end;
  }
  .hidden { display: none !important; }

  /* ========== 顶栏 ========== */
  .header {
    position: sticky; top: 0; z-index: 10;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 14px 24px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  }
  .header h1 {
    font-size: 20px; color: #38bdf8;
    margin-right: 8px; white-space: nowrap;
  }
  .header .spacer { flex: 1; }
  .header .user-info {
    font-size: 13px; color: #94a3b8;
  }
  .header input[type="text"], .header select {
    background: #0f172a; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px;
    padding: 8px 12px; font-size: 14px; outline: none;
  }
  .header input[type="text"]:focus, .header select:focus {
    border-color: #38bdf8;
  }
  .search-box { flex: 1; min-width: 180px; max-width: 320px; }

  /* ========== 按钮 ========== */
  .btn {
    background: #334155; color: #e2e8f0;
    border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 14px; cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: #475569; }
  .btn-primary { background: #0284c7; }
  .btn-primary:hover { background: #0369a1; }
  .btn-success { background: #16a34a; }
  .btn-success:hover { background: #15803d; }
  .btn-danger { background: #dc2626; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 6px; }

  /* ========== 统计条 ========== */
  .stats {
    padding: 12px 24px 0;
    font-size: 13px; color: #94a3b8;
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  .stats b { color: #38bdf8; }

  /* ========== 卡片列表 ========== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    padding: 16px 24px 40px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #475569; }
  .card.solved { opacity: 0.75; }
  .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-title { font-size: 16px; font-weight: 600; flex: 1; word-break: break-all; }
  .badge {
    font-size: 12px; padding: 3px 8px; border-radius: 999px;
    white-space: nowrap;
  }
  .badge-cat { background: #1d4ed8; color: #bfdbfe; }
  .badge-open { background: #b45309; color: #fde68a; }
  .badge-done { background: #15803d; color: #bbf7d0; }
  .card-time { font-size: 12px; color: #64748b; }
  .card-desc { font-size: 14px; color: #cbd5e1; word-break: break-all; }
  .card-solution {
    font-size: 13px; color: #86efac;
    background: #052e16; border: 1px solid #166534;
    border-radius: 8px; padding: 8px 10px; word-break: break-all;
  }
  .card-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .empty {
    grid-column: 1 / -1;
    text-align: center; color: #64748b;
    padding: 60px 0; font-size: 15px;
  }

  /* ========== 模态框 ========== */
  .modal-mask {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    align-items: center; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    width: 90%; max-width: 460px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .modal h2 { font-size: 18px; margin-bottom: 16px; color: #38bdf8; }
  .modal label {
    display: block; font-size: 13px; color: #94a3b8;
    margin: 12px 0 4px;
  }
  .modal input[type="text"], .modal textarea {
    width: 100%;
    background: #0f172a; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px;
    padding: 9px 12px; font-size: 14px; outline: none;
    font-family: inherit;
  }
  .modal input:focus, .modal textarea:focus { border-color: #38bdf8; }
  .modal textarea { resize: vertical; min-height: 70px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .backup-list {
    max-height: 260px; overflow-y: auto;
    border: 1px solid #334155; border-radius: 8px;
  }
  .backup-item {
    padding: 10px 12px; font-size: 13px; cursor: pointer;
    border-bottom: 1px solid #1e293b;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .backup-item:hover { background: #0f172a; }
  .backup-item.selected { background: #0c4a6e; }

  /* ========== 轻提示 ========== */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #334155; color: #f1f5f9;
    padding: 10px 20px; border-radius: 10px; font-size: 14px;
    z-index: 200; display: none;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
  }
  .toast.show { display: block; animation: fadein 0.2s; }
  @keyframes fadein { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }

  @media (max-width: 640px) {
    .header { padding: 12px 16px; }
    .grid { padding: 12px 16px 32px; }
    .search-box { max-width: none; }
  }
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="login-wrap hidden" id="loginPage">
  <div class="login-card">
    <h1>🔐 问题笔记本</h1>
    <div class="sub">请输入密码以继续使用</div>
    <label>密码</label>
    <input type="password" id="loginPwd" placeholder="在此输入密码" autofocus>
    <div class="actions">
      <button class="btn btn-primary" onclick="doLogin()">登录</button>
    </div>
  </div>
</div>

<!-- ===== 主界面 ===== -->
<div id="mainApp" class="hidden">

<!-- ===== 顶栏 ===== -->
<div class="header">
  <h1>📒 问题笔记本</h1>
  <input type="text" id="searchInput" class="search-box" placeholder="搜索… 多个词用空格分隔">
  <select id="statusFilter">
    <option value="all">全部状态</option>
    <option value="open">未解决</option>
    <option value="solved">已解决</option>
  </select>
  <select id="categoryFilter">
    <option value="all">全部分类</option>
  </select>
  <span class="spacer"></span>
  <div class="user-info" id="userInfo"></div>
  <button class="btn" id="logoutBtn" onclick="doLogout()" style="display:none;">退出登录</button>
  <button class="btn btn-primary" onclick="openAddModal()">＋ 添加问题</button>
  <button class="btn" onclick="exportCsv()">📥 导出 CSV</button>
  <button class="btn" onclick="doBackup()">💾 备份</button>
  <button class="btn" onclick="openRestoreModal()">♻️ 恢复</button>
</div>

<!-- ===== 统计条 ===== -->
<div class="stats" id="stats"></div>

<!-- ===== 卡片列表 ===== -->
<div class="grid" id="grid"></div>

<!-- ===== 添加 / 编辑模态框 ===== -->
<div class="modal-mask" id="editModal">
  <div class="modal">
    <h2 id="editModalTitle">添加问题</h2>
    <label>标题 *</label>
    <input type="text" id="editTitle" placeholder="问题标题">
    <label>描述</label>
    <textarea id="editDesc" placeholder="问题详细描述（可选）"></textarea>
    <label>分类</label>
    <input type="text" id="editCategory" placeholder="未分类">
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('editModal')">取消</button>
      <button class="btn btn-primary" id="editSaveBtn" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- ===== 标记解决模态框 ===== -->
<div class="modal-mask" id="solveModal">
  <div class="modal">
    <h2>✅ 标记为已解决</h2>
    <p id="solveTitle" style="font-size:14px;color:#94a3b8;margin-bottom:4px;"></p>
    <label>解决方案 / 心得</label>
    <textarea id="solveSolution" placeholder="写下你是怎么解决的…"></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('solveModal')">取消</button>
      <button class="btn btn-success" onclick="saveSolve()">标记解决</button>
    </div>
  </div>
</div>

<!-- ===== 删除确认模态框 ===== -->
<div class="modal-mask" id="deleteModal">
  <div class="modal">
    <h2>🗑️ 删除问题</h2>
    <p style="font-size:14px;color:#cbd5e1;">确定要删除 <b id="deleteTitle"></b> 吗？此操作不可恢复。</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('deleteModal')">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<!-- ===== 恢复模态框 ===== -->
<div class="modal-mask" id="restoreModal">
  <div class="modal">
    <h2>♻️ 从备份恢复</h2>
    <p style="font-size:13px;color:#94a3b8;margin-bottom:10px;">恢复会覆盖当前全部数据，请谨慎操作。</p>
    <div class="backup-list" id="backupList"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('restoreModal')">取消</button>
      <button class="btn btn-danger" onclick="confirmRestore()">恢复所选</button>
    </div>
  </div>
</div>

</div><!-- /mainApp -->

<div class="toast" id="toast"></div>

<script>
// ========== 全局安全配置：由服务端模板注入 ==========
const AUTH_ENABLED = {{ auth_enabled }};   // "true" or "false"（字符串）
const INIT_LOGGED_IN = {{ logged_in }};   // "true" or "false"
let __csrf_token = "{{ csrf_token }}";    // CSRF 令牌，登录成功后会被刷新

// ========== 全局状态 ==========
let questions = [];          // 全部问题（从后端拉取）
let selectedBackup = null;   // 恢复弹窗里选中的备份文件
let editingId = null;        // 正在编辑的问题 ID（null = 新增）

// ========== 工具函数 ==========
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2200);
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// ========== fetch 封装：统一携带 CSRF 头，并处理 401 跳转登录 ==========
async function api(url, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  headers['X-CSRF-Token'] = __csrf_token;
  if (opts.body && !(opts.body instanceof FormData) &&
      !opts.headers || !Object.keys(opts.headers).some(k => k.toLowerCase() === 'content-type')) {
    headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(url, Object.assign({}, opts, {
    credentials: 'same-origin',
    headers,
  }));
  if (res.status === 401) {
    // 认证过期/未登录：强制展示登录页
    showLoginPage();
    throw new Error('未登录');
  }
  if (res.status === 403) {
    try {
      const err = await res.json();
      toast('❌ ' + (err.error || 'CSRF 校验失败'));
    } catch (_) {
      toast('❌ 请求被拒绝');
    }
    throw new Error('CSRF 校验失败');
  }
  return res;
}

// ========== 登录 / 登出 ==========
function showLoginPage() {
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('loginPwd').value = '';
  setTimeout(() => document.getElementById('loginPwd').focus(), 50);
}

function showMainApp() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  // 用户信息栏
  const infoEl = document.getElementById('userInfo');
  const logoutBtn = document.getElementById('logoutBtn');
  if (AUTH_ENABLED) {
    infoEl.textContent = '已登录';
    logoutBtn.style.display = '';
  } else {
    infoEl.textContent = '';
    logoutBtn.style.display = 'none';
  }
}

async function doLogin() {
  const pwd = document.getElementById('loginPwd').value;
  if (!pwd) { toast('⚠️ 请输入密码'); return; }
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      toast('❌ ' + (err.error || '登录失败'));
      return;
    }
    const data = await res.json();
    if (data.token) __csrf_token = data.token;  // 登录成功后刷新 token
    toast('✅ 登录成功');
    showMainApp();
    load();
  } catch (err) {
    toast('❌ 网络错误');
    console.error('doLogin 失败:', err);
  }
}

document.addEventListener('keydown', (e) => {
  // 登录页回车登录
  const loginEl = document.getElementById('loginPwd');
  if (!document.getElementById('loginPage').classList.contains('hidden')
      && document.activeElement === loginEl && e.key === 'Enter') {
    doLogin();
  }
});

async function doLogout() {
  try {
    await api('/api/logout', { method: 'POST' });
  } catch (_) {}
  sessionStorage.clear();
  showLoginPage();
}

// ========== 数据加载与渲染 ==========
async function load() {
  try {
    const res = await api('/api/questions');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    questions = await res.json();
    renderFilters();
    render();
  } catch (err) {
    if (err.message === '未登录') return;  // 已在 api() 里跳转
    toast('❌ 加载失败，请确认服务已启动');
    console.error('load() 失败:', err);
    document.getElementById('grid').innerHTML =
      '<div class="empty">加载失败… 请确认 python web_app.py 已启动</div>';
  }
}

function renderFilters() {
  const cats = [...new Set(questions.map(q => q.category))].sort();
  const sel = document.getElementById('categoryFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="all">全部分类</option>' +
    cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value = current;
}

function currentFilter() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const cat = document.getElementById('categoryFilter').value;
  return { kw, status, cat };
}

function render() {
  const { kw, status, cat } = currentFilter();
  const keywords = kw ? kw.split(/\s+/) : [];

  const filtered = questions.filter(q => {
    if (status === 'open' && q.is_solved) return false;
    if (status === 'solved' && !q.is_solved) return false;
    if (cat !== 'all' && q.category !== cat) return false;
    if (keywords.length) {
      const text = [q.title, q.description, q.solution, q.category].join(' ').toLowerCase();
      if (!keywords.every(k => text.includes(k))) return false;
    }
    return true;
  });

  const open = questions.filter(q => !q.is_solved).length;
  const solved = questions.length - open;
  document.getElementById('stats').innerHTML =
    `共 <b>${questions.length}</b> 条 · 未解决 <b style="color:#fbbf24">${open}</b> · 已解决 <b style="color:#4ade80">${solved}</b>` +
    (filtered.length !== questions.length ? ` · 当前显示 <b>${filtered.length}</b> 条` : '');

  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">空空如也～ 点击右上角「添加问题」记下第一个问题吧</div>';
    return;
  }

  grid.innerHTML = filtered.map(q => `
    <div class="card ${q.is_solved ? 'solved' : ''}">
      <div class="card-top">
        <span class="badge badge-cat">${esc(q.category)}</span>
        <span class="card-title">${esc(q.title)}</span>
        <span class="badge ${q.is_solved ? 'badge-done' : 'badge-open'}">${q.is_solved ? '已解决' : '未解决'}</span>
      </div>
      <div class="card-time">🕐 ${esc(q.timestamp)}</div>
      ${q.description ? `<div class="card-desc">${esc(q.description)}</div>` : ''}
      ${q.is_solved && q.solution ? `<div class="card-solution">💡 ${esc(q.solution)}</div>` : ''}
      <div class="card-actions">
        <button class="btn btn-sm" onclick="openEditModal(${q.id})">✏️ 编辑</button>
        ${q.is_solved
          ? `<button class="btn btn-sm btn-success" onclick="openSolveModal(${q.id})">📝 改方案</button>`
          : `<button class="btn btn-sm btn-success" onclick="openSolveModal(${q.id})">✅ 标记解决</button>`}
        <button class="btn btn-sm btn-danger" onclick="openDeleteModal(${q.id})">🗑️ 删除</button>
      </div>
    </div>
  `).join('');
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('statusFilter').addEventListener('change', render);
document.getElementById('categoryFilter').addEventListener('change', render);

// ========== 添加 / 编辑 ==========
function openAddModal() {
  editingId = null;
  document.getElementById('editModalTitle').textContent = '添加问题';
  document.getElementById('editTitle').value = '';
  document.getElementById('editDesc').value = '';
  document.getElementById('editCategory').value = '';
  openModal('editModal');
  document.getElementById('editTitle').focus();
}

function openEditModal(id) {
  const q = questions.find(x => x.id === id);
  if (!q) return;
  editingId = id;
  document.getElementById('editModalTitle').textContent = '编辑问题';
  document.getElementById('editTitle').value = q.title;
  document.getElementById('editDesc').value = q.description;
  document.getElementById('editCategory').value = q.category;
  openModal('editModal');
}

async function saveEdit() {
  const title = document.getElementById('editTitle').value.trim();
  if (!title) { toast('⚠️ 标题不能为空'); return; }
  const body = {
    title,
    description: document.getElementById('editDesc').value.trim(),
    category: document.getElementById('editCategory').value.trim()
  };

  const url = editingId === null ? '/api/questions' : `/api/questions/${editingId}`;
  const method = editingId === null ? 'POST' : 'PUT';
  try {
    const res = await api(url, { method, body: JSON.stringify(body) });
    if (res.ok) {
      closeModal('editModal');
      toast(editingId === null ? '✅ 问题已添加' : '✅ 问题已更新');
      load();
    } else {
      const err = await res.json();
      toast('❌ ' + (err.error || '保存失败'));
    }
  } catch (err) {
    if (err.message === '未登录') return;
    toast('❌ 网络错误，保存失败');
    console.error('saveEdit() 失败:', err);
  }
}

// ========== 标记解决 ==========
let solvingId = null;
function openSolveModal(id) {
  const q = questions.find(x => x.id === id);
  if (!q) return;
  solvingId = id;
  document.getElementById('solveTitle').textContent = q.title;
  document.getElementById('solveSolution').value = q.solution || '';
  openModal('solveModal');
}

async function saveSolve() {
  const solution = document.getElementById('solveSolution').value.trim();
  try {
    const res = await api(`/api/questions/${solvingId}`, {
      method: 'PUT',
      body: JSON.stringify({ is_solved: true, solution })
    });
    if (res.ok) {
      closeModal('solveModal');
      toast('✅ 已标记为已解决');
      load();
    } else {
      const err = await res.json();
      toast('❌ ' + (err.error || '操作失败'));
    }
  } catch (err) {
    if (err.message === '未登录') return;
    toast('❌ 网络错误，操作失败');
    console.error('saveSolve() 失败:', err);
  }
}

// ========== 删除 ==========
let deletingId = null;
function openDeleteModal(id) {
  const q = questions.find(x => x.id === id);
  if (!q) return;
  deletingId = id;
  document.getElementById('deleteTitle').textContent = `「${q.title}」`;
  openModal('deleteModal');
}

async function confirmDelete() {
  try {
    const res = await api(`/api/questions/${deletingId}`, { method: 'DELETE' });
    if (res.ok) {
      closeModal('deleteModal');
      toast('🗑️ 已删除');
      load();
    } else {
      const err = await res.json();
      toast('❌ ' + (err.error || '删除失败'));
    }
  } catch (err) {
    if (err.message === '未登录') return;
    toast('❌ 网络错误，删除失败');
    console.error('confirmDelete() 失败:', err);
  }
}

// ========== 导出 / 备份 / 恢复 ==========
function exportCsv() {
  // CSV 导出是浏览器直接下载（GET，通过 cookie 即可通过认证），
  // 但浏览器会带上 CSRF 头；这里改用 fetch + blob 下载以便正确附加头。
  api('/api/export', { method: 'GET' }).then(async res => {
    if (!res.ok) {
      toast('❌ 导出失败');
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const cd = res.headers.get('Content-Disposition') || '';
    let name = 'questions.csv';
    const m = cd.match(/filename="?([^";]+)"?/);
    if (m) name = m[1];
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }).catch(err => {
    if (err.message === '未登录') return;
    toast('❌ 网络错误，导出失败');
  });
}

async function doBackup() {
  try {
    const res = await api('/api/backup', { method: 'POST', body: '{}' });
    const data = await res.json();
    if (res.ok) {
      toast(`💾 已备份：${data.filename}`);
    } else {
      toast('❌ ' + (data.error || '备份失败'));
    }
  } catch (err) {
    if (err.message === '未登录') return;
    toast('❌ 网络错误，备份失败');
    console.error('doBackup() 失败:', err);
  }
}

async function openRestoreModal() {
  selectedBackup = null;
  try {
    const res = await api('/api/backups');
    const backups = await res.json();
    const list = document.getElementById('backupList');
    if (!backups.length) {
      list.innerHTML = '<div style="padding:14px;color:#64748b;font-size:13px;">还没有任何备份</div>';
    } else {
      list.innerHTML = backups.map((name, i) => `
        <div class="backup-item" data-name="${esc(name)}" onclick="pickBackup(this, '${esc(name)}')">
          <span>${esc(name)}</span><span>${i === 0 ? '🆕 最新' : ''}</span>
        </div>
      `).join('');
    }
    openModal('restoreModal');
  } catch (err) {
    if (err.message === '未登录') return;
    toast('❌ 加载备份列表失败');
    console.error('openRestoreModal() 失败:', err);
  }
}

function pickBackup(el, name) {
  document.querySelectorAll('.backup-item').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
  selectedBackup = name;
}

async function confirmRestore() {
  if (!selectedBackup) { toast('⚠️ 请先选择一个备份'); return; }
  if (!confirm(`确定从 ${selectedBackup} 恢复吗？当前数据会被覆盖！`)) return;
  try {
    const res = await api('/api/restore', {
      method: 'POST',
      body: JSON.stringify({ filename: selectedBackup })
    });
    if (res.ok) {
      closeModal('restoreModal');
      toast('♻️ 数据已恢复');
      load();
    } else {
      const err = await res.json();
      toast('❌ ' + (err.error || '恢复失败'));
    }
  } catch (err) {
    if (err.message === '未登录') return;
    toast('❌ 网络错误，恢复失败');
    console.error('confirmRestore() 失败:', err);
  }
}

// ========== 启动 ==========
(function bootstrap() {
  // 根据模板注入的认证状态决定首屏
  if (AUTH_ENABLED && !INIT_LOGGED_IN) {
    showLoginPage();
  } else {
    showMainApp();
    load();
  }
})();
</script>
